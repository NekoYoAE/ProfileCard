<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160" role="img" aria-label="{{nameAttr:280:22}}">
  <style>
    svg {
      --card-bg: #1c1f26;
      --bio: #9ca3af;
      --num: #e6e6e6;
      --label: #9ca3af;
      --line: rgba(255,255,255,0.12);
      --accent: #8b9cf7;
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif; }
    .header { fill: var(--accent); font-size: 20px; font-weight: 700; }
    .bio { fill: var(--bio); font-size: 14px; }
    .stat-label { fill: var(--label); font-size: 14px; font-weight: 600; }
    .stat-value { fill: var(--num); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .rank-caption { fill: var(--label); font-size: 12px; font-weight: 600; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes ringDraw {
      from { stroke-dashoffset: 276.5; }
      to { stroke-dashoffset: var(--ring-target, 0); }
    }
    .anim { animation: fadeUp 0.6s cubic-bezier(0.22, 0.9, 0.36, 1) both; }
    .ring-progress { animation: ringDraw 1.1s cubic-bezier(0.22, 0.9, 0.36, 1) 0.16s both; }
    .d0 { animation-delay: 0s; }
    .d1 { animation-delay: 0.08s; }
    .d2 { animation-delay: 0.16s; }
    @media (prefers-reduced-motion: reduce) { .anim, .ring-progress { animation: none; } }
  </style>
  <rect x="0.5" y="0.5" rx="12" width="399" height="159" fill="var(--card-bg)" stroke="var(--line)" />
  <text class="header anim d0" x="18" y="36">{{name}}</text>
  <text class="bio anim d1" x="18" y="58">{{bio:235:14}}</text>
  <g transform="translate(20, 90)">
    <g class="anim d1">
      <text x="0" y="0" class="stat-label">获赞:</text>
      <text x="170" y="0" class="stat-value">{{likes}}</text>
    </g>
    <g class="anim d2">
      <text x="0" y="24" class="stat-label">粉丝:</text>
      <text x="170" y="24" class="stat-value">{{followers}}</text>
    </g>
    <g class="anim d2">
      <text x="0" y="48" class="stat-label">信誉分:</text>
      <text x="170" y="48" class="stat-value">{{score}}</text>
    </g>
  </g>
  <g transform="translate(312, 82)">
    <g class="anim d2">
      <circle cx="0" cy="0" r="44" fill="none" stroke="var(--line)" stroke-width="8" />
      <circle class="ring-progress" cx="0" cy="0" r="44" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="{{rankOffset}}" transform="rotate(-90)" style="--ring-target: {{rankOffset}}" />
      <text x="0" y="10" text-anchor="middle" font-size="30" font-weight="800" fill="var(--accent)">{{rank}}</text>
    </g>
  </g>
</svg>
